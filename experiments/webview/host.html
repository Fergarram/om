<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Om Webview Demo</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				background: #1a1a1a;
				color: #ddd;
				font-family: monospace;
				overflow: hidden;
			}

			#panes {
				display: flex;
				height: 100%;
			}

			.pane {
				display: flex;
				flex-direction: column;
				flex: 1;
				min-width: 0;
				border-right: 1px solid #333;
			}

			.pane:last-child {
				border-right: none;
			}

			.pane_toolbar {
				display: flex;
				align-items: center;
				gap: 6px;
				height: 40px;
				padding: 0 8px;
				background: #262626;
				border-bottom: 1px solid #333;
			}

			.pane_toolbar button {
				background: #333;
				color: #ddd;
				border: 1px solid #444;
				border-radius: 4px;
				padding: 4px 10px;
				font-family: monospace;
				cursor: pointer;
			}

			.pane_toolbar button:hover {
				background: #3d3d3d;
			}

			.pane_url {
				flex: 1;
				min-width: 0;
				background: #1a1a1a;
				color: #ddd;
				border: 1px solid #444;
				border-radius: 4px;
				padding: 5px 8px;
				font-family: monospace;
				outline: none;
			}

			.pane_url:focus {
				border-color: #666;
			}

			.pane_stats {
				color: #7dffb4;
				white-space: nowrap;
				font-size: 11px;
			}

			isolated-webview {
				flex: 1;
				min-height: 0;
			}
		</style>
	</head>
	<body>
		<div id="panes"></div>

		<script src="isolated-webview.js"></script>
		<script>
			//
			// Two independent panes, proving multiple guests in one host.
			//

			const panes = document.getElementById("panes");
			const local_page = new URL("guest_test_page.html", location.href).href;

			createPane(local_page);
			createPane("https://example.com");

			function createPane(initial_url) {
				const pane = document.createElement("div");
				pane.className = "pane";

				const toolbar = document.createElement("div");
				toolbar.className = "pane_toolbar";

				const back_button = button("<");
				const forward_button = button(">");
				const reload_button = button("R");

				const url_input = document.createElement("input");
				url_input.className = "pane_url";
				url_input.spellcheck = false;
				url_input.placeholder = "Enter URL";

				const stats = document.createElement("span");
				stats.className = "pane_stats";

				toolbar.append(back_button, forward_button, reload_button, url_input, stats);

				const view = document.createElement("isolated-webview");
				view.setAttribute("src", initial_url);

				pane.append(toolbar, view);
				panes.appendChild(pane);

				back_button.addEventListener("click", () => view.goBack());
				forward_button.addEventListener("click", () => view.goForward());
				reload_button.addEventListener("click", () => view.reload());

				url_input.addEventListener("keydown", (event) => {
					if (event.key === "Enter") view.loadURL(url_input.value);
				});

				view.addEventListener("did-navigate", (event) => {
					if (document.activeElement !== url_input) url_input.value = event.detail.url;
				});

				view.addEventListener("webview-stats", (event) => {
					stats.textContent = `${event.detail.fps}fps ${event.detail.draw_ms.toFixed(2)}ms`;
				});

				return view;
			}

			function button(label) {
				const el = document.createElement("button");
				el.textContent = label;
				return el;
			}
		</script>
	</body>
</html>
